name: DevSecOps Pipeline

on:
  push:
    branches:
      - actividad-2-devsecops
      - main-secure
      - main-vulnerable

  pull_request:
    branches:
      - actividad-2-devsecops
      - main-secure
      - main-vulnerable

jobs:
  basic-validation:
    name: Basic project validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          echo "Validating euVWA project structure..."
          test -d vulnerable
          test -d secure
          test -f README.md
          test -f docker-compose.yml
          echo "Repository structure is valid."

  sast-semgrep:
    name: SAST Analysis - Semgrep
    runs-on: ubuntu-latest
    needs: basic-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep security audit
        uses: semgrep/semgrep-action@v1
        with:
          config: p/security-audit

  dependency-scan:
    name: Dependency Scan - Trivy
    runs-on: ubuntu-latest
    needs: basic-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table

  sbom-generation:
    name: SBOM Generation - CycloneDX
    runs-on: ubuntu-latest
    needs: basic-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SBOM with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom-cyclonedx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom-cyclonedx.json


  container-scan:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest
    needs: basic-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build secure Docker image
        run: |
          docker build -f Dockerfile.secure -t euvwa-secure:latest .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: euvwa-secure:latest
          format: table